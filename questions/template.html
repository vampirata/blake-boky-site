<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Blake &amp; Boky Questions</title>
<link rel="icon" href="https://blake-boky.g58tnpr47h.workers.dev/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap">
<style>
/* Blake & Boky "together" grey mode, their exact palette:
   stone ground, hairline text, paper headings, gold accent, black buttons. */
:root {
	--stone: #5c5852;
	--stone-2: #66625b;
	--ink: #0f0f0f;
	--black: #000000;
	--paper: #f5f2eb;
	--hairline: #dbdbdb;
	--grey-c2: #c2c2c2;
	--gold-light: #e3caa6;
	--gold: #cca46c;
	--hover-grey: #454545;
	--line: rgba(219, 219, 219, 0.28);
	--display: "Cormorant Garamond", "Times New Roman", serif;
	--body: "Inter", "Helvetica Neue", Arial, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
	background: var(--stone); color: var(--hairline); font-family: var(--body); font-weight: 300;
	font-size: 16px; line-height: 1.6; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; overflow: hidden;
}
form { height: 100%; margin: 0; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.top {
	display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px 0;
	padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.02em; color: var(--paper); text-decoration: none; }
.saved { font-size: 12px; letter-spacing: 1.68px; text-transform: uppercase; color: var(--grey-c2); text-align: right; }
.bar { height: 1px; background: var(--line); margin-top: 16px; }
.bar i { display: block; height: 1px; width: 0; background: var(--gold-light); transition: width .6s cubic-bezier(.22,1,.36,1); }
.stage { flex: 1; position: relative; overflow: hidden; }
.slide {
	position: absolute; inset: 0; overflow-y: auto; display: flex; padding-block: 32px 120px;
	padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
	transition: transform .7s cubic-bezier(.16,1,.3,1), opacity .5s ease;
}
.slide[data-pos="next"] { transform: translateY(48px); opacity: 0; pointer-events: none; }
.slide[data-pos="prev"] { transform: translateY(-48px); opacity: 0; pointer-events: none; }
.inner { width: 100%; max-width: 760px; margin: auto; display: grid; gap: 22px; }
.eyebrow { margin: 0; font-size: 14px; letter-spacing: 3.4px; text-transform: uppercase; color: var(--gold-light); }
.qnum { display: flex; align-items: baseline; gap: 10px; margin: 0; color: var(--gold-light); font-family: var(--display); font-size: 22px; }
.qnum small { font-family: var(--body); font-size: 11px; letter-spacing: 2.42px; text-transform: uppercase; color: var(--grey-c2); }
h1, h2 { font-family: var(--display); font-weight: 500; margin: 0; color: var(--paper); text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: clamp(44px, 7.4vw, 86px); line-height: 1.04; }
h2 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.15; }
.help { margin: 0; max-width: 62ch; color: var(--grey-c2); font-size: 17px; line-height: 1.75; }
.ctx {
	margin: 0; padding: 4px 0 4px 18px; border-left: 1px solid var(--gold-light);
	font-family: var(--display); font-style: italic; font-size: 24px; line-height: 1.4; color: var(--paper);
}
.where { margin: 0; font-size: 12px; letter-spacing: 1.68px; text-transform: uppercase; color: var(--grey-c2); }
.where a { color: var(--gold-light); text-decoration: none; border-bottom: 1px solid currentColor; }
.choices { display: grid; gap: 10px; max-width: 560px; }
.choice {
	display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 16px;
	border: 1px solid var(--line); background: rgba(15, 15, 15, 0.12); color: var(--paper);
	font: inherit; font-size: 17px; cursor: pointer; transition: border-color .25s, background-color .25s, transform .15s;
}
.choice:hover { border-color: var(--gold-light); }
.choice:active { transform: scale(.99); }
.choice .key {
	flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line);
	font-size: 11px; font-weight: 400; color: var(--grey-c2); letter-spacing: 0;
}
.choice[aria-checked="true"] { border-color: var(--gold-light); background: rgba(227, 202, 166, 0.14); }
.choice[aria-checked="true"] .key { background: var(--gold-light); border-color: var(--gold-light); color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; letter-spacing: 1.68px; text-transform: uppercase; color: var(--grey-c2); }
input[type="text"], input[type="url"], input[type="email"], textarea {
	width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--paper);
	font-family: var(--display); font-size: 28px; line-height: 1.35; padding: 6px 0 8px; border-radius: 0; transition: border-color .25s;
}
textarea { resize: none; min-height: 3.2em; overflow: hidden; }
input::placeholder, textarea::placeholder { color: var(--grey-c2); opacity: .5; }
input:focus, textarea:focus { outline: none; border-bottom-color: var(--gold-light); }
.choice:focus-visible, .btn:focus-visible, .nav button:focus-visible, .drop:focus-within, .where a:focus-visible { outline: 1px solid var(--gold-light); outline-offset: 3px; }
.row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn {
	display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 22px; border: 0;
	background: var(--black); color: var(--paper); font-family: var(--display); font-style: italic; font-size: 22px;
	cursor: pointer; transition: background-color .3s, padding .3s;
}
.btn:hover { background: var(--hover-grey); }
.btn.ghost {
	background: transparent; border: 1px solid var(--line); font-family: var(--body); font-style: normal;
	font-size: 12px; letter-spacing: 1.92px; text-transform: uppercase; font-weight: 400;
}
.btn.ghost:hover { border-color: var(--gold); background: var(--gold); color: var(--ink); }
.hint { font-size: 12px; color: var(--grey-c2); }
.hint b { font-weight: 400; color: var(--paper); }
.nav { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 1px; z-index: 2; }
.nav button { width: 42px; height: 38px; border: 0; background: var(--black); color: var(--paper); cursor: pointer; font-size: 16px; transition: background-color .25s; }
.nav button:hover:not(:disabled) { background: var(--gold); color: var(--ink); }
.nav button:disabled { opacity: .35; cursor: default; }
.err { margin: 0; min-height: 1.2em; font-size: 13px; color: var(--gold-light); }
.drop {
	display: grid; gap: 10px; padding: 22px; border: 1px dashed var(--line); text-align: center;
	color: var(--grey-c2); transition: border-color .25s, background-color .25s; cursor: pointer;
}
.drop.over { border-color: var(--gold-light); background: rgba(227, 202, 166, 0.08); }
.drop strong { font-family: var(--display); font-weight: 500; font-size: 24px; color: var(--paper); }
.files { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.files li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--paper); }
.files li span { overflow-wrap: anywhere; }
.files button { background: none; border: 0; color: var(--gold-light); cursor: pointer; font: inherit; font-size: 12px; letter-spacing: 1.68px; text-transform: uppercase; }
.summary { display: grid; border-top: 1px solid var(--line); max-height: 44vh; overflow-y: auto; margin: 0; }
.summary div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.summary dt { color: var(--grey-c2); margin: 0; }
.summary dd { margin: 0; color: var(--paper); white-space: pre-wrap; overflow-wrap: anywhere; }
.summary .empty { color: var(--grey-c2); font-style: italic; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
@media (max-width: 600px) {
	.summary div { grid-template-columns: 1fr; gap: 2px; }
	input[type="text"], input[type="url"], input[type="email"], textarea { font-size: 23px; }
	.ctx { font-size: 20px; }
	.help { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .slide, .bar i { transition: none; } }
</style>
</head>
<body>
<form id="qform" method="post" enctype="multipart/form-data" novalidate>
	<div class="app">
		<div class="top">
			<a class="brand" href="__PREVIEW__" target="_blank" rel="noopener">Blake &amp; Boky</a>
			<span class="saved" id="saved" aria-live="polite"></span>
		</div>
		<div class="bar" aria-hidden="true"><i id="bar"></i></div>
		<div class="stage" id="stage"></div>
		<div class="nav">
			<button type="button" id="up" aria-label="Previous question">&#8593;</button>
			<button type="button" id="down" aria-label="Next question">&#8595;</button>
		</div>
	</div>
	<div id="hidden-fields" hidden></div>
	<div class="hp" aria-hidden="true"><input type="text" name="_honey" tabindex="-1" autocomplete="off"></div>
</form>

<script id="form-data" type="application/json">__FORM__</script>
<script>
(() => {
	const form = JSON.parse(document.getElementById("form-data").textContent);
	const SEND_TO = "__SEND_TO__";
	const THANKS = location.origin + "/thanks";
	const Q = form.questions;
	const KEY = "answers:" + form.id;
	let answers = {};
	try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
	const N = Q.length;
	let i = 0;
	const stage = document.getElementById("stage");
	const bar = document.getElementById("bar");
	const saved = document.getElementById("saved");
	const qform = document.getElementById("qform");
	const letters = "ABCDEFGH";
	const MAX_FILES = 3, MAX_BYTES = 10 * 1024 * 1024;
	let files = [];

	const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
	const opt = (o) => (typeof o === "string" ? { label: o } : o);
	const where = (q) => q.where ? `<p class="where">On the site: <a href="${esc(form.preview + q.where)}" target="_blank" rel="noopener">${esc(q.where === "/" ? "home page" : q.where)}</a></p>` : "";
	const size = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.ceil(b / 1024) + " KB";

	function answerText(q) {
		if (q.type === "files") return files.map((f) => f.name).join(", ");
		const a = answers[q.id];
		if (a == null || a === "") return "";
		if (q.type === "fields") return q.fields.map((f) => a[f.id] ? `${f.label}: ${a[f.id]}` : "").filter(Boolean).join("\n");
		if (q.type === "choice") return a.choice + (a.text ? `: ${a.text}` : "");
		return String(a);
	}

	const slidesHtml = () => [welcome(), ...Q.map(question), review()];
	function render() {
		stage.innerHTML = "";
		slidesHtml().forEach((html, k) => {
			const s = document.createElement("section");
			s.className = "slide";
			s.dataset.k = k;
			s.innerHTML = `<div class="inner">${html}</div>`;
			stage.appendChild(s);
		});
		[...stage.children].forEach(wireSlide);
		go(i, true);
	}

	function welcome() {
		const started = Q.some((q) => answerText(q));
		return `
			<p class="eyebrow">Website rebuild · ${N} questions</p>
			<h1>${esc(form.title)}</h1>
			<p class="help">${esc(form.intro)}</p>
			<div class="row">
				<button class="btn" type="button" data-next>${started ? "Continue where you left off" : "Start"} <span aria-hidden="true">&#8594;</span></button>
				<span class="hint">or press <b>Enter</b></span>
			</div>
			<p class="where">New site preview: <a href="${esc(form.preview)}" target="_blank" rel="noopener">${esc(form.preview.replace(/^https:\/\//, ""))}</a></p>`;
	}

	function question(q, n) {
		const a = answers[q.id];
		let body = "";
		if (q.type === "choice") {
			body = `<div class="choices" role="radiogroup" aria-labelledby="h-${q.id}">` + q.options.map((o, k) => {
				o = opt(o);
				const on = a && a.choice === o.label;
				return `<button type="button" class="choice" role="radio" aria-checked="${on}" data-choice="${esc(o.label)}" data-input="${o.input ? 1 : ""}"><span class="key">${letters[k]}</span><span>${esc(o.label)}</span></button>`;
			}).join("") + `</div>` + q.options.map(opt).filter((o) => o.input).map((o) => `
				<div class="field" data-for="${esc(o.label)}" ${a && a.choice === o.label ? "" : "hidden"}>
					<input type="${o.kind === "url" ? "url" : "text"}" aria-label="${esc(o.label)}" placeholder="${esc(o.input)}" value="${esc(a && a.choice === o.label ? a.text || "" : "")}" autocomplete="off">
				</div>`).join("");
		} else if (q.type === "fields") {
			body = q.fields.map((f) => `
				<div class="field">
					<label for="${q.id}-${f.id}">${esc(f.label)}</label>
					<input id="${q.id}-${f.id}" data-field="${f.id}" type="${f.kind === "url" ? "url" : "text"}" placeholder="${esc(f.placeholder || "")}" value="${esc((a && a[f.id]) ?? f.value ?? "")}" autocomplete="off">
				</div>`).join("");
		} else if (q.type === "files") {
			body = `
				<label class="drop" data-drop>
					<strong>Drop files here or choose them</strong>
					<span>Images, PDF or documents · up to ${MAX_FILES} files, 10 MB in total</span>
					<input type="file" data-picker multiple accept="image/*,.pdf,.doc,.docx,.txt,.rtf,.pages,.key,.zip" class="hp">
				</label>
				<ul class="files" data-list></ul>`;
		} else if (q.type === "short") {
			body = `<div class="field"><input aria-labelledby="h-${q.id}" id="${q.id}-in" type="${q.kind || "text"}" placeholder="${esc(q.placeholder || "")}" value="${esc(a || "")}" autocomplete="off"></div>`;
		} else {
			body = `<div class="field"><textarea aria-labelledby="h-${q.id}" id="${q.id}-in" rows="1" placeholder="${esc(q.placeholder || "Type your answer here")}">${esc(a || "")}</textarea></div>`;
		}
		const hint = q.type === "long" ? "<b>Shift + Enter</b> for a new line" : q.type === "choice" ? `press <b>${letters.slice(0, q.options.length).split("").join("</b>, <b>")}</b>` : "press <b>Enter</b>";
		return `
			<p class="qnum">${n + 1} <small>of ${N}</small></p>
			<h2 id="h-${q.id}">${esc(q.q)}</h2>
			${q.ctx ? `<p class="ctx">${esc(q.ctx)}</p>` : ""}
			${q.help ? `<p class="help">${esc(q.help)}</p>` : ""}
			${body}
			<p class="err" data-err aria-live="polite"></p>
			<div class="row">
				<button class="btn" type="button" data-next>OK <span aria-hidden="true">&#10003;</span></button>
				<button class="btn ghost" type="button" data-skip>Skip</button>
				<span class="hint">${hint}</span>
			</div>
			${where(q)}`;
	}

	function review() {
		const rows = Q.map((q, k) => {
			const t = answerText(q);
			return `<div><dt>${k + 1}. ${esc(q.q)}</dt><dd>${t ? esc(t) : '<span class="empty">Skipped</span>'}</dd></div>`;
		}).join("");
		return `
			<p class="eyebrow">Review</p>
			<h2>Thank you. Here is what you told us.</h2>
			<p class="help" id="send-state">Use the arrows to change anything. When you send, your answers and files go straight to Kait.</p>
			<div class="field">
				<label for="who">Your name</label>
				<input id="who" type="text" placeholder="So Kait knows who answered" value="${esc(answers._who || "")}" autocomplete="name">
			</div>
			<dl class="summary">${rows}</dl>
			<p class="err" data-err aria-live="polite"></p>
			<div class="row">
				<button class="btn" type="button" data-send>Send answers <span aria-hidden="true">&#8594;</span></button>
			</div>`;
	}

	function collect(q, s) {
		if (!q || q.type === "files") return;
		if (q.type === "choice") {
			const on = s.querySelector('.choice[aria-checked="true"]');
			if (!on) return;
			const box = s.querySelector(`.field[data-for="${CSS.escape(on.dataset.choice)}"] input`);
			answers[q.id] = { choice: on.dataset.choice, text: box ? box.value.trim() : "" };
		} else if (q.type === "fields") {
			const v = {};
			s.querySelectorAll("[data-field]").forEach((el) => { v[el.dataset.field] = el.value.trim(); });
			answers[q.id] = v;
		} else {
			answers[q.id] = s.querySelector("input, textarea").value.trim();
		}
	}

	function validate(s) {
		const err = s.querySelector("[data-err]");
		err.textContent = "";
		const bad = [...s.querySelectorAll('input[type="url"], input[type="email"]')].find((el) => {
			const v = el.value.trim();
			return v && v !== "https://" && !el.checkValidity();
		});
		if (bad) {
			err.textContent = bad.type === "email" ? "That email address looks incomplete. Check it or leave it empty." : "That link looks incomplete. It should start with https://";
			bad.focus();
			return false;
		}
		s.querySelectorAll('input[type="url"]').forEach((el) => { if (el.value.trim() === "https://") el.value = ""; });
		return true;
	}

	function persist() {
		try { localStorage.setItem(KEY, JSON.stringify(answers)); saved.textContent = "Saved on this device"; } catch {}
	}

	function go(k, instant) {
		i = Math.max(0, Math.min(N + 1, k));
		[...stage.children].forEach((s) => {
			const sk = +s.dataset.k;
			s.dataset.pos = sk === i ? "now" : sk < i ? "prev" : "next";
			s.inert = sk !== i;
		});
		bar.style.width = `${(Math.min(i, N) / N) * 100}%`;
		document.getElementById("up").disabled = i === 0;
		document.getElementById("down").disabled = i === N + 1;
		const cur = stage.children[i];
		setTimeout(() => {
			const inputs = [...cur.querySelectorAll("textarea, input:not([type=file])")].filter((el) => !el.closest("[hidden]"));
			const f = inputs[0] || cur.querySelector(".choice[aria-checked='true']") || cur.querySelector(".choice") || cur.querySelector("[data-next], [data-send]");
			if (f && !instant) f.focus({ preventScroll: true });
		}, instant ? 0 : 450);
	}

	function next(skip) {
		const cur = stage.children[i];
		const q = Q[i - 1];
		if (q && !skip) {
			if (!validate(cur)) return;
			collect(q, cur);
			persist();
		}
		if (i === N) {
			const rev = stage.children[N + 1];
			rev.querySelector(".inner").innerHTML = review();
			wireSlide(rev);
		}
		go(i + 1);
	}

	function choose(btn) {
		const s = btn.closest(".slide");
		s.querySelectorAll(".choice").forEach((b) => b.setAttribute("aria-checked", String(b === btn)));
		s.querySelectorAll(".field[data-for]").forEach((f) => { f.hidden = f.dataset.for !== btn.dataset.choice; });
		if (btn.dataset.input) {
			const inp = s.querySelector(`.field[data-for="${CSS.escape(btn.dataset.choice)}"] input`);
			setTimeout(() => inp && inp.focus(), 50);
		} else setTimeout(() => next(), 380);
	}

	function addFiles(list, s) {
		const err = s.querySelector("[data-err]");
		err.textContent = "";
		for (const f of list) {
			if (files.length >= MAX_FILES) { err.textContent = `Up to ${MAX_FILES} files. Send more by email to Kait.`; break; }
			if (files.reduce((a, x) => a + x.size, 0) + f.size > MAX_BYTES) { err.textContent = `${f.name} is too large to add. Files can be 10 MB in total; send bigger ones by email or a download link.`; continue; }
			files.push(f);
		}
		drawFiles(s);
	}
	function drawFiles(s) {
		const ul = s.querySelector("[data-list]");
		ul.innerHTML = files.map((f, k) => `<li><span>${esc(f.name)} · ${size(f.size)}</span><button type="button" data-remove="${k}">Remove</button></li>`).join("");
		ul.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => { files.splice(+b.dataset.remove, 1); drawFiles(s); }));
	}

	function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

	function wireSlide(s) {
		s.querySelectorAll("[data-next]").forEach((b) => b.addEventListener("click", () => next()));
		s.querySelectorAll("[data-skip]").forEach((b) => b.addEventListener("click", () => next(true)));
		s.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => choose(b)));
		s.querySelectorAll("textarea").forEach((t) => { grow(t); t.addEventListener("input", () => grow(t)); });
		const drop = s.querySelector("[data-drop]");
		if (drop) {
			const picker = drop.querySelector("[data-picker]");
			picker.addEventListener("change", () => { addFiles([...picker.files], s); picker.value = ""; });
			["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
			["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
			drop.addEventListener("drop", (e) => addFiles([...e.dataTransfer.files], s));
			drawFiles(s);
		}
		const send = s.querySelector("[data-send]");
		if (send) send.addEventListener("click", () => submit(s));
	}

	// Sends one email to Kait through FormSubmit: every answer as its own row,
	// plus the files as attachments. The page then moves to /thanks.
	function submit(s) {
		const who = s.querySelector("#who").value.trim();
		answers._who = who;
		persist();
		const box = document.getElementById("hidden-fields");
		box.innerHTML = "";
		const add = (name, value) => {
			const el = document.createElement("textarea");
			el.name = name; el.value = value; box.appendChild(el);
		};
		add("_subject", `Blake & Boky website questions${who ? ": " + who : ""}`);
		add("_template", "table");
		add("_captcha", "false");
		add("_next", THANKS);
		add("Answered by", who || "(no name given)");
		Q.forEach((q, k) => { if (q.type !== "files") add(`${String(k + 1).padStart(2, "0")}. ${q.q}`, answerText(q) || "(skipped)"); });
		files.forEach((f, k) => {
			const input = document.createElement("input");
			input.type = "file";
			input.name = k === 0 ? "attachment" : `attachment${k + 1}`;
			const dt = new DataTransfer();
			dt.items.add(f);
			input.files = dt.files;
			box.appendChild(input);
		});
		const state = document.getElementById("send-state");
		state.textContent = "Sending...";
		s.querySelector("[data-send]").disabled = true;
		qform.action = `https://formsubmit.co/${SEND_TO}`;
		try { localStorage.setItem(KEY + ":sent", new Date().toISOString()); } catch {}
		qform.submit();
	}

	document.addEventListener("keydown", (e) => {
		const t = e.target;
		const typing = t.matches && t.matches("input, textarea");
		if (e.key === "Enter" && !e.shiftKey && t.tagName !== "BUTTON") {
			if (i === N + 1) return;
			e.preventDefault();
			next();
			return;
		}
		if (typing) return;
		const q = Q[i - 1];
		if (q && q.type === "choice" && /^[a-h]$/i.test(e.key)) {
			const b = stage.children[i].querySelectorAll(".choice")[letters.indexOf(e.key.toUpperCase())];
			if (b) { e.preventDefault(); choose(b); }
		}
		if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); next(true); }
		if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
	});
	document.getElementById("up").addEventListener("click", () => go(i - 1));
	document.getElementById("down").addEventListener("click", () => next(true));
	render();
})();
</script>
</body>
</html>
